<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard — Successwa Client Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700;9..144,900&family=Archivo:wght@500;600;700;800&family=Karla:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=52" />
<link rel="icon" href="logo.png?v=10">
</head>
<body>
  <div id="topnav"></div>
  <main class="hub">
    <div class="hub-head">
      <div><h1>Job Dashboard</h1><p class="page-sub" id="subLine">All active jobs</p></div>
      <button class="btn btn-primary" id="newJobBtn" style="display:none" data-tip="Create a new job for a client. Opens the Clients page where you pick the entity and assign staff.">+ New Job</button>
    </div>
    <div class="stat-cards" id="statCards"></div>
    <div class="hub-toolbar">
      <input type="search" id="q" placeholder="Search client, job or client ID…" style="min-width:240px" data-tip-below data-tip="Search by client name, job ID (e.g. JB-0001) or client ID (e.g. CL-0001)." />
      <select id="fStage" data-tip-below data-tip="Filter the list to jobs at a specific internal stage."><option value="">All stages</option></select>
      <select id="fMine" data-tip-below data-tip="Show all jobs, or only the jobs assigned to you."><option value="">All staff</option><option value="mine">Assigned to me</option></select>
    </div>
    <div id="tableWrap"><p class="muted">Loading…</p></div>
  </main>
<script src="nav.js?v=20"></script>
<script src="hub-common.js?v=40"></script>
<script src="dashboard.js?v=41"></script>
</body>
</html>
